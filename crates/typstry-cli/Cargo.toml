[package]
name = "typstry-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "typstry"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
futures-util.workspace = true
getrandom.workspace = true
ignore.workspace = true
loro.workspace = true
loro-protocol.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
ratatui.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
typstry-doc.workspace = true
typstry-wire = { workspace = true, features = ["crypto", "mls"] }
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
portable-pty.workspace = true
tempfile.workspace = true
typstry-server.workspace = true
vt100.workspace = true
# The compat fixture generator writes doc.json the way typstry-doc reads it.
typstry-doc = { workspace = true, features = ["test-util"] }
# The compat fixture generator seals with fixed salts and IVs.
typstry-wire = { workspace = true, features = ["crypto", "test-util"] }

[lints]
workspace = true
