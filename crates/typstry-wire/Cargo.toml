[package]
name = "typstry-wire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
loro-protocol.workspace = true
aes-gcm = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[features]
# The end-to-end encryption clients do. The server never holds a key, so it
# leaves this off and does not even link the cipher.
crypto = [
    "dep:aes-gcm",
    "dep:base64",
    "dep:ed25519-dalek",
    "dep:hkdf",
    "dep:sha2",
    "dep:thiserror",
    "dep:zeroize",
]
# Exposes the encryption entry points that take a caller-chosen salt and IV,
# which the fixture tests need for byte-stable records.
test-util = ["crypto"]

[dev-dependencies]
typstry-wire = { path = ".", features = ["crypto", "test-util"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
