name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The editor imports tinymist's wasm build, which isn't in git. Building
      # it takes a while, so it is cached until the script (and with it the
      # pinned commit) changes.
      - name: Restore tinymist
        id: tinymist
        uses: actions/cache@v6
        with:
          path: apps/web/vendor/tinymist
          key: tinymist-${{ hashFiles('apps/web/scripts/build-tinymist.sh') }}
      - uses: taiki-e/install-action@v2
        if: steps.tinymist.outputs.cache-hit != 'true'
        with:
          tool: wasm-pack@0.15.0
      - name: Build tinymist
        if: steps.tinymist.outputs.cache-hit != 'true'
        run: apps/web/scripts/build-tinymist.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  e2e:
    # Tests the web job's build, so neither tinymist nor the frontend gets
    # built twice.
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Built up front so Playwright's server start doesn't run into its
      # timeout while cargo compiles.
      - run: cargo build -p typstry-server
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      # The cache only holds the browser, not the system libraries it needs.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects the toolchain and components
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: typstry:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name typstry -p 8787:8787 typstry:ci
          for i in $(seq 1 20); do
            curl -fsS localhost:8787/healthz && break
            sleep 1
          done
          curl -fsS localhost:8787/healthz
          curl -fsS -X POST -H 'content-type: application/json' -d '{"title":"CI"}' localhost:8787/api/projects
      - name: Server logs
        if: always()
        run: docker logs typstry
