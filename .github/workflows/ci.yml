name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes the previous run. Pushes to main are never
# cancelled: the publish workflows hang off their result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Split from the checks so e2e can start as soon as the build is done
  # instead of waiting for lint, typecheck and unit tests.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    # Tests the build job's output, so the frontend isn't built twice.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - run: rustup show
      # Only the server job saves this cache. With both saving the same key,
      # whichever finished second was silently dropped.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: false
      # Built up front so Playwright's server start doesn't run into its
      # timeout while cargo compiles. The CLI is for cli-group-project.spec.ts.
      # Kept separate: building both at once turns on the CLI's typstry-wire
      # features in the server too, and `cargo run` would rebuild it.
      - run: cargo build -p typstry-server
      - run: cargo build -p typstry-cli
      - uses: ./.github/actions/setup-playwright
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  static-e2e:
    # The Pages build: no server, so no Rust and no dependency on the build
    # job, whose output is the server variant.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      # Same base as the Pages workflow, which the suite's URLs rely on.
      - run: pnpm --filter web build:static
        env:
          TYPSTRY_BASE: /typstry/
      - uses: ./.github/actions/setup-playwright
      - run: pnpm test:e2e:static
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-static-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # rust-toolchain.toml selects the toolchain and components
      - run: rustup show
      # e2e restores this cache too. Only saved on main since PR caches
      # aren't visible to other branches.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: typstry:ci
          # Same scope as the publish workflow's amd64 build, so the image
          # published after a green main run is mostly a cache hit. PRs don't
          # write it, main couldn't read their caches anyway.
          cache-from: type=gha,scope=linux/amd64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=linux/amd64,mode=max' || '' }}
      - name: Smoke test
        run: |
          docker run -d --name typstry -p 8787:8787 typstry:ci
          for i in $(seq 1 20); do
            curl -fsS localhost:8787/healthz && break
            sleep 1
          done
          curl -fsS localhost:8787/healthz
          # The image's HEALTHCHECK runs this, there's no curl inside.
          docker exec typstry typstry-server healthcheck
          curl -fsS -X POST localhost:8787/api/spaces
      - name: Server logs
        if: always()
        run: docker logs typstry
