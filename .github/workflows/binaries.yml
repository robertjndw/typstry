name: Binaries

# Same triggers as the image workflow: a green push to main refreshes the
# `nightly` prerelease, a published release gets the binaries attached.
# workflow_run runs the file from the default branch but defaults to its HEAD,
# so the tested commit is checked out explicitly.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

# A newer nightly run cancels an older one that's still pending. Runs that
# overlap less than that are caught by the check before publishing. Releases
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'release' && github.ref || 'nightly' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'release' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      matrix:
        include:
          # Linux builds run on the oldest image so the binary links against
          # an older glibc and runs on more distributions.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      # Both for the provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # rust-toolchain.toml selects the toolchain
      - run: rustup show
      # A release whose tag doesn't match the crates would ship binaries that
      # report the wrong version.
      - name: Check version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "typstry-cli") | .version')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Caches saved from a tag are only visible to that tag.
          save-if: ${{ github.event_name == 'workflow_run' }}
      # Nightly builds put the commit into `typstry --version`. Releases leave
      # TYPSTRY_BUILD_SHA unset: an empty value would still count as set.
      - name: Build
        env:
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          if [ -n "$SHA" ]; then
            export TYPSTRY_BUILD_SHA="${SHA:0:7}"
          fi
          cargo build --release --locked -p typstry-cli
      - name: Package
        run: |
          name="typstry-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/typstry README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      # Lets users check a download with `gh attestation verify`.
      - uses: actions/attest@v4
        with:
          subject-path: typstry-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: typstry-${{ matrix.target }}
          path: typstry-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: typstry-*
          merge-multiple: true
      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
      # CI runs on main can finish out of order, so this run may be older
      # than what `nightly` already points at.
      - name: Check nightly
        id: nightly
        if: github.event_name == 'workflow_run'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2> /dev/null) || current=
          if [ -n "$current" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$current" --jq .status)" = ahead ]; then
            echo "::notice::nightly is already at $current, which is newer than $SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Updated in place instead of recreated, which would notify watchers on
      # every push and briefly 404 the downloads. Releases made with
      # GITHUB_TOKEN don't trigger other workflows, so the image workflow
      # doesn't pick this one up.
      - name: Refresh nightly
        if: github.event_name == 'workflow_run' && steps.nightly.outputs.skip != 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          notes="Built from $SHA on main. Not a stable release."
          if gh release view nightly > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true
            gh release upload nightly dist/* --clobber
            gh release edit nightly --notes "$notes"
          else
            gh release create nightly dist/* \
              --target "$SHA" \
              --prerelease \
              --title "Nightly" \
              --notes "$notes"
          fi
