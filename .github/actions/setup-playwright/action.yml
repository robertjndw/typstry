name: Set up Playwright
description: Chromium and its system libraries for the web app's e2e suites

runs:
  using: composite
  steps:
    - name: Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Restore Playwright browsers
      id: browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter web exec playwright install --with-deps chromium
    # The cache only holds the browser, not the system libraries it needs.
    - if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter web exec playwright install-deps chromium
