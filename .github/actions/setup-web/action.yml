name: Set up web
description: Node, pnpm, dependencies and the wasm builds of tinymist and typstry-wire

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # The editor imports tinymist's wasm build, which isn't in git. Building
    # it takes a while, so it is cached until the script (and with it the
    # pinned commit) changes.
    - name: Restore tinymist
      id: tinymist
      uses: actions/cache@v6
      with:
        path: apps/web/vendor/tinymist
        key: tinymist-${{ hashFiles('apps/web/scripts/build-tinymist.sh') }}
    - uses: taiki-e/install-action@v2
      if: steps.tinymist.outputs.cache-hit != 'true'
      with:
        tool: wasm-pack@0.15.0
    - name: Build tinymist
      if: steps.tinymist.outputs.cache-hit != 'true'
      shell: bash
      run: apps/web/scripts/build-tinymist.sh
    # The web app's crypto and MLS code is typstry-wire built to wasm, so the
    # cache key covers the Rust sources it is built from.
    - name: Restore typstry-wasm
      id: typstry-wasm
      uses: actions/cache@v6
      with:
        path: apps/web/vendor/typstry-wasm
        key: typstry-wasm-${{ hashFiles('apps/web/scripts/build-wasm.sh', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/typstry-wire/**', 'crates/typstry-wasm/**') }}
    - uses: taiki-e/install-action@v2
      if: steps.typstry-wasm.outputs.cache-hit != 'true'
      with:
        tool: wasm-pack@0.15.0
    - name: Build typstry-wasm
      if: steps.typstry-wasm.outputs.cache-hit != 'true'
      shell: bash
      run: apps/web/scripts/build-wasm.sh
