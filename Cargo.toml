[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
typstry-doc = { path = "crates/typstry-doc" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
loro = "1.16.2"
# 0.x: pinned exactly, the wire format must match the npm loro-protocol client.
loro-protocol = "=0.3.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Loro is unusably slow unoptimized (a 360 KB text import takes ~19 s in a
# debug build), so optimize dependencies even in dev while keeping our own
# crates fast to compile.
[profile.dev.package."*"]
opt-level = 2
